name: build

on:
  push:
  pull_request:
  workflow_dispatch:

# One job per supported target. All builds are native: LDC has no Windows
# ARM64 toolchain, so a Windows ARM64 job cannot link against an ARM D runtime.
jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            ldc: ldc2-1.43.0-linux-x86_64.tar.xz
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            ldc: ldc2-1.43.0-linux-aarch64.tar.xz
          - name: macos-x86_64
            runner: macos-15-intel
            ldc: ldc2-1.43.0-osx-x86_64.tar.xz
          - name: macos-arm64
            runner: macos-15
            ldc: ldc2-1.43.0-osx-arm64.tar.xz
          - name: windows-x86_64
            runner: windows-2025
            ldc: ldc2-1.43.0-windows-x64.7z

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Install LDC (POSIX)
        if: runner.os != 'Windows'
        run: |
          mkdir -p "$RUNNER_TEMP/ldc"
          curl -fsSL "https://github.com/ldc-developers/ldc/releases/download/v1.43.0/${{ matrix.ldc }}" \
            | tar -xJ -C "$RUNNER_TEMP/ldc" --strip-components=1
          echo "$RUNNER_TEMP/ldc/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ldc/bin/ldc2" --version

      - name: Install LDC and MSVC environment (Windows x86-64)
        if: runner.os == 'Windows'
        run: |
          mkdir -p /c/dcad/ldc
          curl -fsSL -o /tmp/ldc.7z \
            "https://github.com/ldc-developers/ldc/releases/download/v1.43.0/${{ matrix.ldc }}"
          7z x /tmp/ldc.7z -o/c/dcad/ldc -y >/dev/null
          LDC_ROOT=$(find /c/dcad/ldc -maxdepth 1 -type d -name 'ldc2-*' | head -1)
          echo "$(cygpath -w "$LDC_ROOT/bin")" >> "$GITHUB_PATH"

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libocct-foundation-dev libocct-modeling-data-dev \
            libocct-modeling-algorithms-dev libocct-data-exchange-dev \
            libocct-ocaf-dev libglfw3-dev libgl1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            g++

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install opencascade glfw

      # Prebuilt MSVC binaries avoid a 1h+ OCCT source build on hosted runners.
      # Both archives use the stable Microsoft C++ ABI that LDC targets.
      - name: Stage prebuilt OCCT and GLFW (Windows)
        if: runner.os == 'Windows'
        run: |
          set -eu
          mkdir -p /c/dcad/occt/include/opencascade /c/dcad/occt/lib \
                   /c/dcad/occt/bin /c/dcad/deps
          curl -fsSL -o /c/dcad/deps/occt.zip \
            https://github.com/Open-Cascade-SAS/OCCT/releases/download/V7_9_3/opencascade-7.9.3-vc14-64.zip
          unzip -q /c/dcad/deps/occt.zip -d /c/dcad/deps
          OCCT=/c/dcad/deps/opencascade-7.9.3-vc14-64
          cp -R "$OCCT/inc/." /c/dcad/occt/include/opencascade/
          cp "$OCCT/win64/vc14/lib/"*.lib /c/dcad/occt/lib/
          cp "$OCCT/win64/vc14/bin/"*.dll /c/dcad/occt/bin/

          curl -fsSL -o /c/dcad/deps/glfw.zip \
            https://github.com/glfw/glfw/releases/download/3.4/glfw-3.4.bin.WIN64.zip
          unzip -q /c/dcad/deps/glfw.zip -d /c/dcad/deps
          GLFW=/c/dcad/deps/glfw-3.4.bin.WIN64
          cp -R "$GLFW/include/GLFW" /c/dcad/occt/include/
          cp "$GLFW/lib-vc2022/glfw3.lib" /c/dcad/occt/lib/

          echo 'C:\dcad\occt\bin' >> "$GITHUB_PATH"
          echo "DCAD_OCCT_INCLUDE=C:/dcad/occt/include/opencascade" >> "$GITHUB_ENV"

      - name: Build and test
        env:
          DCAD_BUILD_TYPE: release
        run: |
          ldc2 --version
          bash tests/run.sh

      # A bare GUI binary cannot find its assets or default script, so each
      # artifact is a small payload directory: binary + runtime data. Windows
      # also carries the OCCT/GLFW DLLs it links against.
      - name: Package target
        run: |
          set -eu
          TARGET="dcad-${{ matrix.name }}"
          mkdir -p "payload/$TARGET" dist
          if [ -f dcad-gui ]; then
            cp dcad-gui "payload/$TARGET/"
          else
            cp dcad-gui.exe "payload/$TARGET/"
          fi
          cp -R README.md gui/assets samples "payload/$TARGET/"
          if [ -d /c/dcad/occt/bin ]; then
            cp /c/dcad/occt/bin/*.dll "payload/$TARGET/"
          fi
          tar -czf "dist/$TARGET.tar.gz" -C payload "$TARGET"

      - name: Upload GUI package
        uses: actions/upload-artifact@v4
        with:
          name: dcad-${{ matrix.name }}
          path: dist/*.tar.gz

  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dcad-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          ls -lh dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tar.gz --clobber
          else
            gh release create "$TAG" dist/*.tar.gz \
              --title "$TAG" --generate-notes
          fi
