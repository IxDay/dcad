name: build

on:
  push:
  pull_request:
  workflow_dispatch:

# One job per requested target. Native runners are used throughout: there is
# no cross-compilation on Linux/macOS, and the Windows ARM job uses MSVC's
# ARM64 toolchain with an LDC config that selects the aarch64 triple.
jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            ldc: ldc2-1.43.0-linux-x86_64.tar.xz
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            ldc: ldc2-1.43.0-linux-aarch64.tar.xz
          - name: macos-x86_64
            runner: macos-15-intel
            ldc: ldc2-1.43.0-osx-x86_64.tar.xz
          - name: macos-arm64
            runner: macos-15
            ldc: ldc2-1.43.0-osx-arm64.tar.xz
          - name: windows-x86_64
            runner: windows-2025
            ldc: ldc2-1.43.0-windows-x64.7z
          - name: windows-arm64
            runner: windows-11-arm
            ldc: ldc2-1.43.0-windows-x64.7z

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Install LDC (POSIX)
        if: runner.os != 'Windows'
        run: |
          mkdir -p "$RUNNER_TEMP/ldc"
          curl -fsSL "https://github.com/ldc-developers/ldc/releases/download/v1.43.0/${{ matrix.ldc }}" \
            | tar -xJ -C "$RUNNER_TEMP/ldc" --strip-components=1
          echo "$RUNNER_TEMP/ldc/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ldc/bin/ldc2" --version

      - name: Install LDC and MSVC environment (Windows x86-64)
        if: matrix.name == 'windows-x86_64'
        run: |
          mkdir -p /c/dcad/ldc
          curl -fsSL -o /tmp/ldc.7z \
            "https://github.com/ldc-developers/ldc/releases/download/v1.43.0/${{ matrix.ldc }}"
          7z x /tmp/ldc.7z -o/c/dcad/ldc -y >/dev/null
          LDC_ROOT=$(find /c/dcad/ldc -maxdepth 1 -type d -name 'ldc2-*' | head -1)
          echo "$(cygpath -w "$LDC_ROOT/bin")" >> "$GITHUB_PATH"

      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.name == 'windows-x86_64'

      - name: Install LDC and ARM64 cross config (Windows ARM)
        if: matrix.name == 'windows-arm64'
        run: |
          mkdir -p /c/dcad/ldc "$USERPROFILE/.ldc"
          curl -fsSL -o /tmp/ldc.7z \
            "https://github.com/ldc-developers/ldc/releases/download/v1.43.0/${{ matrix.ldc }}"
          7z x /tmp/ldc.7z -o/c/dcad/ldc -y >/dev/null
          LDC_ROOT=$(find /c/dcad/ldc -maxdepth 1 -type d -name 'ldc2-*' | head -1)
          echo "$(cygpath -w "$LDC_ROOT/bin")" >> "$GITHUB_PATH"
          # A config file is seen by every ldc2 invocation, including the
          # script host's `execute(["ldc2", ...])`, unlike a .bat wrapper.
          cat > "$USERPROFILE/.ldc/ldc2.conf" <<'EOF'
          "default": {
              switches = [
                  "-mtriple=aarch64-pc-windows-msvc",
              ];
          }
          EOF

      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.name == 'windows-arm64'
        with:
          arch: arm64

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libocct-foundation-dev libocct-modeling-data-dev \
            libocct-modeling-algorithms-dev libocct-data-exchange-dev \
            libocct-ocaf-dev libglfw3-dev libgl1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            g++

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install opencascade glfw

      - name: Stage Windows OCCT and GLFW from vcpkg
        if: runner.os == 'Windows'
        run: |
          VCPKG_ROOT=${VCPKG_INSTALLATION_ROOT:-/c/vcpkg}
          VCPKG_ROOT=$(cygpath -u "$VCPKG_ROOT" 2>/dev/null || echo "$VCPKG_ROOT")
          # dcad's bindings target OCCT 7.7-7.9; current vcpkg ships OCCT 8.x.
          # Overlay just that one port from the 7.9.3-era tree, keeping the
          # runner's current vcpkg executable and tool data files.
          mkdir -p /c/dcad/vcpkg-pin /c/dcad/vcpkg-overlay/ports
          curl -fsSL -o /c/dcad/vcpkg-pin/src.tar.gz \
            https://github.com/microsoft/vcpkg/archive/f5ced78107.tar.gz
          tar -xzf /c/dcad/vcpkg-pin/src.tar.gz -C /c/dcad/vcpkg-pin --strip-components=1
          cp -R /c/dcad/vcpkg-pin/ports/opencascade /c/dcad/vcpkg-overlay/ports/
          TRIPLET=x64-windows
          if [ "${{ matrix.name }}" = "windows-arm64" ]; then
            TRIPLET=arm64-windows
          fi
          "$VCPKG_ROOT/vcpkg" install \
            --overlay-ports=/c/dcad/vcpkg-overlay/ports \
            "opencascade:$TRIPLET" "glfw3:$TRIPLET"
          PREFIX="$VCPKG_ROOT/installed/$TRIPLET"
          mkdir -p /c/dcad/occt/include /c/dcad/occt/lib /c/dcad/occt/bin
          cp -r "$PREFIX/include/." /c/dcad/occt/include/
          cp "$PREFIX/lib/"*.lib /c/dcad/occt/lib/
          cp "$PREFIX/bin/"*.dll /c/dcad/occt/bin/
          echo 'C:\dcad\occt\bin' >> "$GITHUB_PATH"
          echo "DCAD_OCCT_INCLUDE=C:/dcad/occt/include/opencascade" >> "$GITHUB_ENV"

      - name: Build and test
        run: |
          ldc2 --version
          bash tests/run.sh

      # A bare GUI binary cannot find its assets or default script, so each
      # artifact is a small payload directory: binary + runtime data. Windows
      # also carries the OCCT/GLFW DLLs it links against.
      - name: Package target
        run: |
          set -eu
          TARGET="dcad-${{ matrix.name }}"
          mkdir -p "payload/$TARGET" dist
          if [ -f dcad-gui ]; then
            cp dcad-gui "payload/$TARGET/"
          else
            cp dcad-gui.exe "payload/$TARGET/"
          fi
          cp -R README.md gui/assets samples "payload/$TARGET/"
          if [ -d /c/dcad/occt/bin ]; then
            cp /c/dcad/occt/bin/*.dll "payload/$TARGET/"
          fi
          tar -czf "dist/$TARGET.tar.gz" -C payload "$TARGET"

      - name: Upload GUI package
        uses: actions/upload-artifact@v4
        with:
          name: dcad-${{ matrix.name }}
          path: dist/*.tar.gz

  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dcad-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          ls -lh dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tar.gz --clobber
          else
            gh release create "$TAG" dist/*.tar.gz \
              --title "$TAG" --generate-notes
          fi
