name: build

on:
  push:
  pull_request:
  workflow_dispatch:

# One job per supported target. All builds are native: LDC has no Windows
# ARM64 toolchain, so a Windows ARM64 job cannot link against an ARM D runtime.
jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            ldc: ldc2-1.43.0-linux-x86_64.tar.xz
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            ldc: ldc2-1.43.0-linux-aarch64.tar.xz
          - name: macos-x86_64
            runner: macos-15-intel
            ldc: ldc2-1.43.0-osx-x86_64.tar.xz
          - name: macos-arm64
            runner: macos-15
            ldc: ldc2-1.43.0-osx-arm64.tar.xz
          - name: windows-x86_64
            runner: windows-2025
            ldc: ldc2-1.43.0-windows-x64.7z

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Install LDC (POSIX)
        if: runner.os != 'Windows'
        run: |
          mkdir -p "$RUNNER_TEMP/ldc"
          curl -fsSL "https://github.com/ldc-developers/ldc/releases/download/v1.43.0/${{ matrix.ldc }}" \
            | tar -xJ -C "$RUNNER_TEMP/ldc" --strip-components=1
          echo "$RUNNER_TEMP/ldc/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ldc/bin/ldc2" --version

      - name: Install LDC and MSVC environment (Windows x86-64)
        if: runner.os == 'Windows'
        run: |
          mkdir -p /c/dcad/ldc
          curl -fsSL -o /tmp/ldc.7z \
            "https://github.com/ldc-developers/ldc/releases/download/v1.43.0/${{ matrix.ldc }}"
          7z x /tmp/ldc.7z -o/c/dcad/ldc -y >/dev/null
          LDC_ROOT=$(find /c/dcad/ldc -maxdepth 1 -type d -name 'ldc2-*' | head -1)
          echo "$(cygpath -w "$LDC_ROOT/bin")" >> "$GITHUB_PATH"

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libocct-foundation-dev libocct-modeling-data-dev \
            libocct-modeling-algorithms-dev libocct-data-exchange-dev \
            libocct-ocaf-dev libglfw3-dev libgl1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            g++

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install opencascade glfw

      # Prebuilt MSVC binaries avoid a 1h+ OCCT source build on hosted runners.
      # Both archives use the stable Microsoft C++ ABI that LDC targets.
      - name: Stage prebuilt OCCT and GLFW (Windows)
        if: runner.os == 'Windows'
        run: |
          set -eu
          mkdir -p /c/dcad/occt/include/opencascade /c/dcad/occt/lib \
                   /c/dcad/occt/bin /c/dcad/deps
          curl -fsSL -o /c/dcad/deps/occt.zip \
            https://github.com/Open-Cascade-SAS/OCCT/releases/download/V7_9_3/opencascade-7.9.3-vc14-64.zip
          unzip -q /c/dcad/deps/occt.zip -d /c/dcad/deps
          OCCT=/c/dcad/deps/opencascade-7.9.3-vc14-64
          cp -R "$OCCT/inc/." /c/dcad/occt/include/opencascade/
          cp "$OCCT/win64/vc14/lib/"*.lib /c/dcad/occt/lib/
          cp "$OCCT/win64/vc14/bin/"*.dll /c/dcad/occt/bin/

          # OCCT's DLLs import these from its separate 3rdparty package. The
          # list is the transitive closure for the libraries dcad links, not
          # the full archive (which also contains Qt/VTK/Tcl tooling).
          THIRDPARTY="
            3rdparty-vc14-64/jemalloc-vc14-64/bin/jemalloc.dll
            3rdparty-vc14-64/tbb-2021.13.0-x64/bin/tbb12.dll
            3rdparty-vc14-64/ffmpeg-3.3.4-64/bin/avcodec-57.dll
            3rdparty-vc14-64/ffmpeg-3.3.4-64/bin/avformat-57.dll
            3rdparty-vc14-64/ffmpeg-3.3.4-64/bin/avutil-55.dll
            3rdparty-vc14-64/ffmpeg-3.3.4-64/bin/swscale-4.dll
            3rdparty-vc14-64/freeimage-3.18.0-x64/bin/FreeImage.dll
            3rdparty-vc14-64/freetype-2.13.3-x64/bin/freetype.dll
            3rdparty-vc14-64/openvr-1.14.15-64/bin/win64/openvr_api.dll
            3rdparty-vc14-64/msvc-vc14-64/vcomp140.dll
          "
          curl -fsSL -o /c/dcad/deps/occt3p.zip \
            https://github.com/Open-Cascade-SAS/OCCT/releases/download/V7_9_3/3rdparty-vc14-64.zip
          unzip -q /c/dcad/deps/occt3p.zip $THIRDPARTY -d /c/dcad/deps
          for dll in $THIRDPARTY; do
            cp "/c/dcad/deps/$dll" /c/dcad/occt/bin/
          done

          curl -fsSL -o /c/dcad/deps/glfw.zip \
            https://github.com/glfw/glfw/releases/download/3.4/glfw-3.4.bin.WIN64.zip
          unzip -q /c/dcad/deps/glfw.zip -d /c/dcad/deps
          GLFW=/c/dcad/deps/glfw-3.4.bin.WIN64
          cp -R "$GLFW/include/GLFW" /c/dcad/occt/include/
          # glfw3_mt.lib matches LDC's /MT CRT; the plain glfw3.lib is /MD.
          cp "$GLFW/lib-vc2022/glfw3_mt.lib" /c/dcad/occt/lib/

          echo 'C:\dcad\occt\bin' >> "$GITHUB_PATH"
          echo "DCAD_OCCT_INCLUDE=C:/dcad/occt/include/opencascade" >> "$GITHUB_ENV"

      # tests/run.sh also relocates the macOS GUI and builds/verifies the
      # self-extracting launcher whenever DCAD_EMBED_RESOURCES=1. The launcher
      # itself links no OCCT/GLFW: everything the GUI needs is in that one
      # executable and is expanded into a cache on first run.
      - name: Build, test and embed
        env:
          DCAD_BUILD_TYPE: release
          DCAD_EMBED_RESOURCES: 1
        run: |
          ldc2 --version
          bash tests/run.sh

      # macOS gets a .app bundle (no Terminal); Windows uses a GUI-subsystem
      # launcher (no console); Linux gets a Terminal=false desktop entry.
      - name: Package target
        env:
          DCAD_VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          TARGET="dcad-${{ matrix.name }}"
          mkdir -p dist
          python3 tools/package_release.py "$TARGET" \
            --out payload --version "$DCAD_VERSION"
          tar -czf "dist/$TARGET.tar.gz" -C payload "$TARGET"

      - name: Upload GUI package
        uses: actions/upload-artifact@v4
        with:
          name: dcad-${{ matrix.name }}
          path: dist/*.tar.gz

  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dcad-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job has no checkout, so gh cannot infer the repository from
          # a local git remote. Point it at the workflow's repository.
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          ls -lh dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tar.gz --clobber
          else
            gh release create "$TAG" dist/*.tar.gz \
              --title "$TAG" --generate-notes
          fi
